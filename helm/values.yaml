stage('Update Helm Values and Push') {
    steps {
        dir('test-k8s') {
            withCredentials([usernamePassword(
                credentialsId: 'github-token',
                usernameVariable: 'GIT_USERNAME',
                passwordVariable: 'GIT_TOKEN'
            )]) {
                sh '''
                    set -eu

                    git config user.email "shalthoor@gmail.com"
                    git config user.name "$GIT_USERNAME"

                    if ! grep -q '^[[:space:]]*image:' helm/values.yaml; then
                        echo "No image: entry found in helm/values.yaml"
                        exit 1
                    fi

                    sed -i "s|^[[:space:]]*image:.*|image: us-central1-docker.pkg.dev/$GOOGLE_CLOUD_PROJECT/docker-repo/hello:$IMAGE_TAG|" \
                        helm/values.yaml

                    echo "Updated image:"
                    grep 'image:' helm/values.yaml

                    if git diff --quiet; then
                        echo "No changes to commit."
                        exit 0
                    fi

                    git add helm/values.yaml
                    git commit -m "Update image to $IMAGE_TAG"

                    AUTH_HEADER=$(printf '%s:%s' "$GIT_USERNAME" "$GIT_TOKEN" | base64 | tr -d '\\n')
                    git -c http.extraheader="AUTHORIZATION: basic $AUTH_HEADER" \
                        push origin HEAD:main
                '''
            }
        }
    }
}
